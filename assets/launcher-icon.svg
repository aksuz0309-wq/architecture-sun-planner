<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7fe0"/><stop offset="1" stop-color="#1b2f7a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe7b0"/><stop offset=".55" stop-color="#f6f9f8"/><stop offset="1" stop-color="#c9d3d8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0a1440" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 太陽の光線 -->
  <g stroke="#f3c26b" stroke-width="10" stroke-linecap="round" opacity=".55">
    <line x1="392" y1="118" x2="250" y2="214"/><line x1="392" y1="118" x2="200" y2="170"/>
  </g>
  <circle cx="392" cy="118" r="52" fill="#f3c26b"/>
  <circle cx="392" cy="118" r="38" fill="#ffe08a"/>
  <!-- 建物（左の壁に光が当たる） -->
  <g filter="url(#sh)">
    <path d="M96 436 V222 L168 188 H316 V436 Z" fill="url(#wall)"/>
    <path d="M316 188 L408 222 V436 H316 Z" fill="#5b6aa8"/>
  </g>
  <g fill="#2a3a80" opacity=".85">
    <rect x="128" y="236" width="40" height="34" rx="4"/><rect x="198" y="236" width="40" height="34" rx="4"/><rect x="262" y="236" width="36" height="34" rx="4"/>
    <rect x="128" y="300" width="40" height="34" rx="4"/><rect x="198" y="300" width="40" height="34" rx="4"/><rect x="262" y="300" width="36" height="34" rx="4"/>
    <rect x="128" y="364" width="40" height="34" rx="4"/><rect x="262" y="364" width="36" height="34" rx="4"/>
  </g>
  <rect x="198" y="364" width="40" height="72" rx="4" fill="#2a3a80"/>
  <!-- 影 -->
  <polygon points="408,436 500,436 470,452 408,452" fill="#0a1440" opacity=".35"/>
  <rect x="0" y="436" width="512" height="76" fill="#0f1d57" opacity=".35"/>
</svg>
