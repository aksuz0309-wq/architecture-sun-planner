<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8df0"/><stop offset="1" stop-color="#1b2f7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="96" cy="100" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd36b" stop-opacity=".35"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a" stop-opacity=".75"/><stop offset="1" stop-color="#ffe08a" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".6" stop-color="#ffe29a"/><stop offset="1" stop-color="#f3c26b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0a1440" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- 太陽光：太陽から壁へ広がる光の帯 -->
  <polygon points="96,100 196,184 196,452" fill="url(#beam)"/>
  <g stroke="#ffe9a8" stroke-linecap="round" stroke-width="9" opacity=".8">
    <line x1="96" y1="100" x2="188" y2="196"/><line x1="96" y1="100" x2="188" y2="290"/><line x1="96" y1="100" x2="188" y2="384"/>
  </g>
  <circle cx="96" cy="100" r="50" fill="#ffd25e"/>
  <circle cx="96" cy="100" r="36" fill="#fff0b8"/>
  <g stroke="#ffd25e" stroke-linecap="round" stroke-width="8">
    <line x1="96" y1="22" x2="96" y2="38"/><line x1="18" y1="100" x2="34" y2="100"/><line x1="40" y1="44" x2="52" y2="56"/><line x1="152" y1="44" x2="140" y2="56"/><line x1="40" y1="156" x2="52" y2="144"/>
  </g>
  <!-- 建物：左の壁に光が当たり、右の壁は日陰 -->
  <g filter="url(#sh)">
    <path d="M196 452 V196 L338 168 V452 Z" fill="url(#lit)"/>
    <path d="M338 168 L432 196 V452 H338 Z" fill="#4a5aa0"/>
  </g>
  <g fill="#b9892f" opacity=".55">
    <rect x="218" y="218" width="36" height="32" rx="4"/><rect x="280" y="212" width="34" height="32" rx="4"/>
    <rect x="218" y="280" width="36" height="32" rx="4"/><rect x="280" y="274" width="34" height="32" rx="4"/>
    <rect x="218" y="342" width="36" height="32" rx="4"/><rect x="280" y="336" width="34" height="32" rx="4"/>
  </g>
  <g fill="#2a3a80" opacity=".8">
    <rect x="362" y="226" width="34" height="30" rx="4"/><rect x="362" y="284" width="34" height="30" rx="4"/><rect x="362" y="342" width="34" height="30" rx="4"/>
  </g>
  <rect x="250" y="396" width="40" height="56" rx="4" fill="#8f6a24" opacity=".7"/>
  <rect x="0" y="452" width="512" height="60" fill="#0f1d57" opacity=".4"/>
  <polygon points="432,452 504,452 478,470 432,470" fill="#0a1440" opacity=".4"/>
</svg>
